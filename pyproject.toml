[project]
name = "agent-job-search"
version = "0.1.0"
description = "Job search agent that finds roles, scores fit against a resume and maintains a tracker"
readme = "README.md"
authors = [{ name = "Zaynab Zennour" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["anthropic", "pandas", "scikit-learn", "pydantic", "python-dotenv", "rich"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
job-agent = "job_agent.cli:main"
